name: Build Classic Notepad Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile COM DLL
        run: |
          cl.exe /LD /O2 /EHsc NotepadCommand.cpp /link /DEF:NotepadCommand.def /OUT:NotepadCommand.dll shlwapi.lib shell32.lib ole32.lib

      - name: Create Self-Signed Cert & Sign Package
        shell: pwsh
        run: |
          # 1. Create certificate
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=VanillaClassicNotepad" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Vanilla Classic Notepad" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          # Export public cert (.cer) so client machines can trust it
          Export-Certificate -Cert $cert -FilePath "VanillaClassicNotepad.cer"

          # 2. Package and sign
          $kitBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" | Select-Object -Last 1).FullName
          & "$kitBin\makeappx.exe" pack /d . /p NotepadMenu.msix /nv
          & "$kitBin\signtool.exe" sign /fd SHA256 /a /s My /n "VanillaClassicNotepad" NotepadMenu.msix

      - name: Bundle Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/Assets -Force | Out-Null
          Copy-Item NotepadCommand.dll dist/
          Copy-Item AppxManifest.xml dist/
          Copy-Item NotepadMenu.msix dist/
          Copy-Item VanillaClassicNotepad.cer dist/
          Copy-Item install.ps1 dist/
          Copy-Item uninstall.ps1 dist/
          Copy-Item Assets/* dist/Assets/

          Compress-Archive -Path dist/* -DestinationPath ClassicNotepadContext.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassicNotepadContext
          path: ClassicNotepadContext.zip
